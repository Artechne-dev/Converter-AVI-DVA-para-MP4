name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies & Custom PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install wheel customtkinter
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git
          cd pyinstaller/bootloader
          python ./waf all
          cd ..
          pip install .
          
      - name: Download FFmpeg for bundling
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "."

      - name: Build Executable
        run: |
          pyinstaller --clean Converter-AVI-MP4.spec
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Versão ${{ github.ref_name }}"
          body: "Release automática gerada a partir da tag ${{ github.ref_name }}."
          files: dist/Converter-AVI-MP4.exe
