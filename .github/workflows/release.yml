name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter
          
      - name: Build Executable
        run: |
          $CTK_PATH = (python -c "import site; print(site.getsitepackages()[0])") + "\customtkinter"
          pyinstaller --noconfirm --onefile --windowed --add-data "$CTK_PATH;customtkinter/" --icon="icon.ico" --name Converter-AVI-MP4 main.py
          
      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Versão mais recente (Auto-Build)"
          body: "Esta release é gerada e atualizada automaticamente pelo GitHub Actions a cada novo commit na branch main. Sempre contém a versão mais atualizada do código."
          files: dist/Converter-AVI-MP4.exe
