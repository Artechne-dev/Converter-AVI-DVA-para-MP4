name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies & Custom PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install wheel customtkinter
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git
          cd pyinstaller/bootloader
          python ./waf all
          cd ..
          pip install .
          
      - name: Download FFmpeg for bundling
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "."

      - name: Build Executable
        run: |
          pyinstaller --clean Converter-AVI-MP4.spec
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "Versão ${{ steps.tag_version.outputs.new_tag }}"
          body: "Release automática gerada pelo commit em main.\n\nChangelog:\n${{ steps.tag_version.outputs.changelog }}"
          files: dist/Converter-AVI-MP4.exe
